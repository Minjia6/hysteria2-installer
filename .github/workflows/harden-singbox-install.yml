name: Harden sing-box install

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/harden_singbox_install.py'
      - '.github/workflows/harden-singbox-install.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run harden script
        run: python3 scripts/harden_singbox_install.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Minjia6"
          git config user.email "minjia360@gmail.com"
          git add portal.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: harden sing-box install with multi-mirror and faster failover"
            git push origin HEAD
          fi
